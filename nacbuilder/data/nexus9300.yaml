# Cisco Nexus 9300 fixed switches offered by NaC VXLAN Builder.
#
# Port layouts are taken from Cisco's Nexus 9300 data sheets. Check a model against its data sheet
# before relying on it, and edit or extend this file to match your hardware; the app reads it at start.
#
#   ports:        every front-panel port group (Ethernet1/<first>-<last>), with speed and media
#   roles:        which fabric roles the model is offered for (spine covers super spines too)
#   host_ports:   leaf/border ports for servers, firewalls and VRF-lite uplinks
#   uplink_ports: leaf/border ports for spine uplinks; the last two are the default vPC peer link
#   spine_ports:  spine/super spine ports facing the tier below; the last ones are the super spine uplinks

models:
  # --- leaf / border -------------------------------------------------------------------------
  - model: N9K-C93180YC-FX
    description: 48x 1/10/25G SFP28 + 6x 40/100G QSFP28
    roles: [leaf, border]
    ports:
      - {first: 1, last: 48, speed: 25G, media: SFP28}
      - {first: 49, last: 54, speed: 100G, media: QSFP28}
    host_ports: 1-48
    uplink_ports: 49-54

  - model: N9K-C93180YC-FX3
    description: 48x 1/10/25G SFP28 + 6x 40/100G QSFP28
    roles: [leaf, border]
    ports:
      - {first: 1, last: 48, speed: 25G, media: SFP28}
