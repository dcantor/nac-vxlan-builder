[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nac-vxlan-builder"
version = "0.1.0"
description = "Streamlit wizard that builds Cisco Network as Code VXLAN EVPN (Nexus Dashboard) YAML files"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "streamlit>=1.67,<1.68",  # tested series; st.iframe and width= need 1.67
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "nac-validate==1.0.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes>=3"]
# Cisco's semantic rules (macOS): the app can also install these from Review & export
rules = ["ansible-core>=2.14,<2.19"]

[tool.setuptools.packages.find]
include = ["nacbuilder*"]

[tool.setuptools.package-data]
nacbuilder = ["data/*.yaml", "components/*/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
